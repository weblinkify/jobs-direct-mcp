[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsdirect-mcp"
version = "1.0.0"
description = "MCP server for multi-portal job search, 4-tier ATS fit scoring, resume tailoring, cover letters and Word export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
jobsdirect = "jobsdirect.server:main"

[tool.setuptools]
packages = ["jobsdirect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
